name: linux-0.01-still-runs CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            nasm \
            python3 \
            util-linux

      - name: Build kernel, root image, and bEMU
        run: make all
        env:
          NO_COLOR: 1

      - name: Test authorship and provenance
        run: make test-authorship

      - name: Test deterministic host faults
        run: make test-fault-catalog test-bemu-loading test-ide-faults test-fs-corruption test-artifact-truncation test-power-cut test-irq-faults test-keyboard-faults test-bbp-corruption test-bbp-corruption-sanitized build/test-irq-faults-kvm
        env:
          NO_COLOR: 1

      - name: Test fault aggregate orchestration
        run: python3 tests/test_fault_test.py

      - name: Test research-question evidence map
        run: python3 tests/test_research_questions.py

      - name: Test experimental methodology
        run: python3 tests/test_methodology.py

      - name: Test technical paper
        run: make test-paper

      - name: Test reproduction appendix
        run: make test-reproduction-appendix

      - name: Test evaluator package contract
        run: make test-evaluator-package

      - name: Build and validate evaluator package
        run: |
          SOURCE_DATE_EPOCH=1700000000 make artifact
          revision="$(git rev-parse --short=12 HEAD)"
          package="release/linux-0.01-still-runs-evaluator-${revision}.tar.gz"
          python3 "${package%.tar.gz}.check.py" --archive "${package}"

      - name: Test historical-core patch dataset
        run: python3 tests/test_patch_dataset.py

      - name: Test published golden traces
        run: make test-golden-trace-dataset

      - name: Test published compiler cases
        run: make test-compiler-case-dataset

      - name: Set modes and create checksums
        run: |
          install -m 0644 LICENSE build/LICENSE
          chmod 0755 build/bemu-linux01 build/minix-inspect build/mkimage build/test-irq-faults-kvm
          chmod 0644 \
            build/hello.bin \
            build/kernel.bin \
            build/kernel.elf \
            build/root.img \
            build/root-1991.img \
            build/shell.bin \
            build/update.bin
          cd build
          sha256sum LICENSE root.img kernel.elf kernel.bin bemu-linux01 > SHA256SUMS
          sha256sum \
            LICENSE bemu-linux01 hello.bin kernel.bin kernel.elf minix-inspect mkimage root.img root-1991.img \
            test-irq-faults-kvm \
            shell.bin update.bin > CI_SHA256SUMS
          chmod 0644 SHA256SUMS CI_SHA256SUMS
          sha256sum --check SHA256SUMS
          sha256sum --check CI_SHA256SUMS

      - name: Upload checksummed build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-0.01-build
          path: |
            build/SHA256SUMS
            build/CI_SHA256SUMS
            build/LICENSE
            build/root.img
            build/root-1991.img
            build/test-irq-faults-kvm
            build/kernel.elf
            build/kernel.bin
            build/bemu-linux01
            build/minix-inspect
            build/mkimage
            build/shell.bin
            build/update.bin
            build/hello.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  boot-test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-0.01-build
          path: build

      - name: Verify checksums and restore exact modes
        run: |
          cd build
          sha256sum --check SHA256SUMS
          sha256sum --check CI_SHA256SUMS
          chmod 0755 bemu-linux01 minix-inspect mkimage test-irq-faults-kvm
          chmod 0644 \
            CI_SHA256SUMS LICENSE SHA256SUMS hello.bin kernel.bin kernel.elf root.img root-1991.img \
            shell.bin update.bin

      - name: Require usable KVM
        run: |
          if [[ ! -c /dev/kvm ]]; then
            printf '::error::/dev/kvm is unavailable; bEMU has no supported non-KVM fallback.\n'
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            printf '::error::/dev/kvm exists but is not usable by the runner.\n'
            exit 1
          fi

      - name: Test KVM irqchip fault integration
        run: build/test-irq-faults-kvm

      - name: Install persistence oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux

      - name: Test cross-process filesystem persistence
        run: |
          python3 tests/test_fs_persistence.py \
            --bemu build/bemu-linux01 --kernel build/kernel.bin \
            --alive-img build/root.img --historical-img build/root-1991.img \
            --minix-inspect build/minix-inspect --fsck fsck.minix --timeout 30

      - name: Run normal boot and shell tests
        run: |
          python3 tests/test_harness_utils.py
          python3 tests/test_boot.py \
            --bemu build/bemu-linux01 --kernel build/kernel.bin \
            --img build/root.img --timeout 30
          python3 tests/test_trace_input.py \
            --bemu build/bemu-linux01 --kernel build/kernel.bin \
            --img build/root.img --timeout 30
          PYTHONUNBUFFERED=1 python3 tests/test_shell.py \
            --bemu build/bemu-linux01 --kernel build/kernel.bin \
            --img build/root.img --timeout 120

      - name: Run interactive shell tests
        run: |
          PYTHONUNBUFFERED=1 python3 tests/test_shell.py \
            --bemu build/bemu-linux01 --kernel build/kernel.bin \
            --img build/root.img --timeout 180 --interactive

      - name: Run large-rootfs tests
        run: |
          python3 tests/test_large_rootfs.py \
            --bemu build/bemu-linux01 --kernel build/kernel.bin \
            --mkimage build/mkimage --shell build/shell.bin \
            --update build/update.bin --hello build/hello.bin \
            --factor 3 --timeout 120

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build, boot-test]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-0.01-build
          path: build

      - name: Verify release inputs and set exact modes
        run: |
          cd build
          sha256sum --check SHA256SUMS
          sha256sum --check CI_SHA256SUMS
          chmod 0755 bemu-linux01
          chmod 0755 mkimage
          chmod 0644 \
            CI_SHA256SUMS LICENSE SHA256SUMS hello.bin kernel.bin kernel.elf root.img \
            shell.bin update.bin

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: linux-0.01-still-runs ${{ github.ref_name }}
          body: |
            ## linux-0.01-still-runs ${{ github.ref_name }}

            Automated, checksummed build from commit ${{ github.sha }}.

            ### Artifacts
            - `root.img`: Minix v1 root filesystem
            - `kernel.elf`: kernel ELF with debug symbols
            - `kernel.bin`: PA0 kernel payload with a host-side length trailer
            - `bemu-linux01`: dynamically linked Linux x86-64 KVM runner
            - `LICENSE`: historical Linux, BSD-3-Clause, and modern-project terms
            - `SHA256SUMS`: release artifact checksums

            ### Usage
            ```bash
            sha256sum --check SHA256SUMS
            chmod 0755 bemu-linux01
            ./bemu-linux01 --kernel kernel.bin --root root.img
            ```
          files: |
            build/root.img
            build/kernel.elf
            build/kernel.bin
            build/bemu-linux01
            build/LICENSE
            build/SHA256SUMS
