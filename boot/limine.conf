# limine.conf — boot menu for the linux-0.01 modern port.
# F E R M I ∞ H A R T <contact@fermihart.com>

timeout: 0
default_entry: 1
serial: yes

/Linux 0.01 (Linus Torvalds, 1991)
    protocol: multiboot2
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/linus.bin
    module_string: linux-0.01.bin
